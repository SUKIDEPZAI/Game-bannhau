<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#05070a">
  <title>AI Pose Camera — Neon Skeleton</title>
  <style>
    :root{
      --bg:#05070a;
      --panel:rgba(5,10,16,.72);
      --border:rgba(255,255,255,.12);
      --text:#f4f7fb;
      --muted:#aeb8c7;
      --accent:#00f5a0;
      --danger:#ff5470;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
    #app{position:fixed;inset:0;background:#000}
    #stage{position:absolute;inset:0;overflow:hidden;background:#000}
    #video,#overlay{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;
    }
    #video{background:#000;transform:scaleX(-1)}
    #overlay{transform:scaleX(-1);pointer-events:none}
    .shade{position:absolute;inset:0;pointer-events:none;background:
      linear-gradient(180deg,rgba(0,0,0,.54),transparent 18%,transparent 70%,rgba(0,0,0,.72))
    }
    .topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;z-index:5}
    .brand,.pill,.person-card,.help,.error{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
    .brand{border-radius:14px;padding:8px 11px;font-weight:800;font-size:13px;letter-spacing:.04em}
    .brand span{color:var(--accent)}
    .actions{display:flex;gap:8px}
    button{border:1px solid rgba(255,255,255,.14);background:rgba(8,15,22,.68);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer;min-height:42px}
    button:active{transform:scale(.98)}
    button.primary{border-color:rgba(0,245,160,.34);background:rgba(0,245,160,.12);color:#9fffd8}
    button.danger{border-color:rgba(255,84,112,.32);background:rgba(255,84,112,.11);color:#ff9aab}
    .hud-left{position:absolute;left:12px;top:74px;bottom:90px;z-index:4;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .person-card{border-radius:15px;padding:10px 11px;pointer-events:auto}
    .person-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .id{font-weight:900;font-size:14px}
    .action{font-weight:800;font-size:13px;color:#9fffd8}
    .meta{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.5}
    .angles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:7px}
    .angle{background:rgba(255,255,255,.05);border-radius:8px;padding:5px 4px;text-align:center}
    .angle b{display:block;font-size:12px;color:#fff}.angle span{font-size:9px;color:#93a0b3}
    .bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;gap:10px}
    .status{display:flex;gap:7px;flex-wrap:wrap}
    .pill{border-radius:999px;padding:7px 10px;font-size:11px;color:#dce4ef}
    .pill strong{color:#fff}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:5px}
    .controls{display:flex;gap:7px}
    .center{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:rgba(0,0,0,.58)}
    .dialog{width:min(420px,calc(100vw - 30px));padding:20px;border:1px solid var(--border);border-radius:20px;background:rgba(7,11,16,.9);backdrop-filter:blur(18px)}
    .dialog h1{margin:0 0 8px;font-size:22px}.dialog p{margin:0 0 15px;color:var(--muted);line-height:1.5;font-size:13px}
    .dialog .row{display:flex;gap:8px;flex-wrap:wrap}
    .hidden{display:none!important}
    .error{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:9;padding:10px 13px;border-radius:12px;max-width:calc(100vw - 30px);font-size:12px;color:#ffdbe1}
    #fps{font-variant-numeric:tabular-nums}
    .radar-wrap{position:absolute;right:14px;top:78px;width:142px;height:142px;z-index:4;pointer-events:none}
    .radar{position:absolute;inset:0;border:1px solid rgba(0,245,160,.32);border-radius:50%;background:radial-gradient(circle,rgba(0,245,160,.08),rgba(0,0,0,.18) 65%,rgba(0,245,160,.03));box-shadow:inset 0 0 28px rgba(0,245,160,.08),0 0 22px rgba(0,245,160,.05);overflow:hidden}
    .radar-ring{position:absolute;border:1px solid rgba(0,245,160,.16);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
    .r1{width:33%;height:33%}.r2{width:66%;height:66%}.r3{width:94%;height:94%}
    .radar-cross{position:absolute;background:rgba(0,245,160,.12)}.radar-cross.h{left:0;right:0;top:50%;height:1px}.radar-cross.v{top:0;bottom:0;left:50%;width:1px}
    .radar-sweep{position:absolute;width:50%;height:1px;left:50%;top:50%;transform-origin:left center;background:linear-gradient(90deg,rgba(0,245,160,.85),transparent);animation:sweep 2.2s linear infinite;box-shadow:0 0 8px #00f5a0}
    @keyframes sweep{to{transform:rotate(360deg)}}
    .radar-label{position:absolute;top:147px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 9px/1 monospace;color:rgba(159,255,216,.75);letter-spacing:.08em}
    .radar-dot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px currentColor;animation:dotpulse 1.2s infinite}
    @keyframes dotpulse{50%{opacity:.45;transform:translate(-50%,-50%) scale(.75)}}
    .telemetry{position:absolute;right:14px;top:242px;z-index:4;width:142px;padding:8px 10px;border-radius:12px;background:rgba(5,10,16,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);font:10px/1.35 monospace}
    .telemetry div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.telemetry span{color:#8190a3}.telemetry b{color:#9fffd8}
    @media(max-width:700px){.radar-wrap{width:105px;height:105px;right:9px;top:70px}.radar-label{top:110px;font-size:8px}.telemetry{top:184px;right:9px;width:105px;font-size:8px}.telemetry div{padding:2px 0}.hud-left{width:calc(100vw - 125px)}}

    @media (max-width:600px){
      .hud-left{top:64px;bottom:82px}
      .person-card{padding:8px}
      .angles{gap:3px}.angle{padding:4px 2px}
      .topbar{padding-left:10px;padding-right:10px}
      .brand{font-size:12px}
      button{padding:9px 10px;min-height:40px}
      .bottom{padding-left:10px;padding-right:10px}
      .pill{font-size:10px;padding:6px 8px}
    }
  </style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="shade"></div>

    <div class="topbar">
      <div class="brand">POSE <span>NEON</span></div>
      <div class="actions">
        <button id="switchBtn" title="Đổi camera">↔ Camera</button>
        <button id="fullBtn" title="Toàn màn hình">⛶</button>
      </div>
    </div>

    <div id="cards" class="hud-left"></div>

    <div class="radar-wrap">
      <div class="radar">
        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>
        <div class="radar-cross h"></div>
        <div class="radar-cross v"></div>
        <div id="radarDots"></div>
        <div class="radar-sweep"></div>
      </div>
      <div class="radar-label">BODY RADAR · LIVE</div>
    </div>

    <div class="telemetry">
      <div><span>POSE ENGINE</span><b id="engineState">READY</b></div>
      <div><span>TRACKS</span><b id="trackCount">0</b></div>
      <div><span>LATENCY</span><b id="latency">-- ms</b></div>
      <div><span>FPS</span><b id="telemetryFps">0</b></div>
    </div>

    <div class="bottom">
      <div class="status">
        <div class="pill"><span class="dot"></span><strong id="state">Đang chờ</strong></div>
        <div class="pill">👥 <strong id="people">0</strong></div>
        <div class="pill">FPS <strong id="fps">0</strong></div>
        <div class="pill">AI <strong id="modelState">OFF</strong></div>
      </div>
      <div class="controls">
        <button id="startBtn" class="primary">📷 Bật camera</button>
        <button id="stopBtn" class="danger hidden">■ Dừng</button>
      </div>
    </div>

    <div id="welcome" class="center">
      <div class="dialog">
        <h1>AI Pose Camera</h1>
        <p>Skeleton neon + tracking ID + góc tay/chân + nhận diện giơ tay, squat, chống đẩy và nhảy.</p>
        <div class="row">
          <button id="startMain" class="primary">📷 Bắt đầu</button>
          <button id="fullMain">⛶ Fullscreen</button>
        </div>
        <p style="margin-top:12px;font-size:11px">Video được xử lý cục bộ trên thiết bị bằng MediaPipe; ảnh camera không được gửi lên server AI.</p>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
  </div>
</div>

<script type="module">
  import { FilesetResolver, PoseLandmarker } from
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

  const MODEL =
    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  const WASM =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";

  const $ = (id) => document.getElementById(id);
  const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
  const welcome = $("welcome"), errorBox = $("error"), cards = $("cards");
  const startBtn = $("startBtn"), startMain = $("startMain"), stopBtn = $("stopBtn");
  const switchBtn = $("switchBtn"), fullBtn = $("fullBtn"), fullMain = $("fullMain");
  const stateEl = $("state"), peopleEl = $("people"), fpsEl = $("fps"), modelEl = $("modelState");

  let landmarker = null, stream = null, running = false, facing = "user";
  let lastVideoTime = -1, lastFrameMs = performance.now(), frames = 0, fps = 0;
  let nextId = 1;
  const tracks = new Map();

  // MediaPipe Pose landmark indices.
  const P = {
    nose:0, leftEye:2, rightEye:5,
    leftShoulder:11, rightShoulder:12,
    leftElbow:13, rightElbow:14,
    leftWrist:15, rightWrist:16,
    leftHip:23, rightHip:24,
    leftKnee:25, rightKnee:26,
    leftAnkle:27, rightAnkle:28,
    leftHeel:29, rightHeel:30,
    leftFoot:31, rightFoot:32
  };

  const BONES = [
    [11,12],[11,13],[13,15],[12,14],[14,16],
    [11,23],[12,24],[23,24],
    [23,25],[25,27],[27,29],[27,31],
    [24,26],[26,28],[28,30],[28,32],
    [0,11],[0,12],[11,24],[12,23]
  ];

  const COLORS = ["#00f5a0","#45a3ff","#ffdc3a","#ff4fa3","#b96cff","#ff7b52","#72f2ff","#d4ff59"];

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const avg = (a,b) => ({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2, visibility:Math.min(a.visibility??1,b.visibility??1)});
  const angle = (a,b,c) => {
    const abx=a.x-b.x, aby=a.y-b.y, cbx=c.x-b.x, cby=c.y-b.y;
    const den=Math.hypot(abx,aby)*Math.hypot(cbx,cby);
    if(!den) return 0;
    return Math.round(Math.acos(clamp((abx*cbx+aby*cby)/den,-1,1))*180/Math.PI);
  };
  const valid = (p) => p && (p.visibility == null || p.visibility > .35);

  function rootOf(lm){
    const s = avg(lm[P.leftShoulder],lm[P.rightShoulder]);
    const h = avg(lm[P.leftHip],lm[P.rightHip]);
    return avg(s,h);
  }

  function anglesFor(lm){
    return {
      le: angle(lm[P.leftShoulder],lm[P.leftElbow],lm[P.leftWrist]),
      re: angle(lm[P.rightShoulder],lm[P.rightElbow],lm[P.rightWrist]),
      lk: angle(lm[P.leftHip],lm[P.leftKnee],lm[P.leftAnkle]),
      rk: angle(lm[P.rightHip],lm[P.rightKnee],lm[P.rightAnkle])
    };
  }

  function centerScore(lm){
    const pts = [lm[P.leftShoulder],lm[P.rightShoulder],lm[P.leftHip],lm[P.rightHip]].filter(valid);
    if(!pts.length) return null;
    return {
      x: pts.reduce((s,p)=>s+p.x,0)/pts.length,
      y: pts.reduce((s,p)=>s+p.y,0)/pts.length
    };
  }

  function scaleOf(lm){
    const sh = avg(lm[P.leftShoulder],lm[P.rightShoulder]);
    const hip = avg(lm[P.leftHip],lm[P.rightHip]);
    return Math.max(.08, Math.hypot(sh.x-hip.x, sh.y-hip.y));
  }

  function classify(track,lm,ang){
    const ls=lm[P.leftShoulder], rs=lm[P.rightShoulder];
    const lh=lm[P.leftHip], rh=lm[P.rightHip];
    const lw=lm[P.leftWrist], rw=lm[P.rightWrist];
    const la=lm[P.leftAnkle], ra=lm[P.rightAnkle];
    const sh=avg(ls,rs), hip=avg(lh,rh), ankle=avg(la,ra);
    const s = Math.max(.08, dist(ls,rs));

    let action="Đứng", score=.55;

    const raisedL = valid(lw) && valid(ls) && lw.y < ls.y - .10;
    const raisedR = valid(rw) && valid(rs) && rw.y < rs.y - .10;
    const kneeAvg=(ang.lk+ang.rk)/2;

    // Squat: knees bent and hips lower than shoulders.
    const squat = kneeAvg < 125 && hip.y > sh.y + .10;
    // Push-up: torso roughly horizontal + elbows bent.
    const torsoDx=Math.abs(hip.x-sh.x);
    const torsoDy=Math.abs(hip.y-sh.y);
    const horizontal = torsoDx > torsoDy*1.35;
    const push = horizontal && ((ang.le>65&&ang.le<135)||(ang.re>65&&ang.re<135));
    // Jump: strong upward root velocity followed by elevated ankles.
    const root=track.root || {x:0,y:0};
    const vy = root.y - track.prevRootY;
    const ankleY = ankle.y;
    const airborne = track.lowFootY != null && ankleY < track.lowFootY - .025;
    const jumping = track.jumpCooldown <= 0 && (vy < -.018 || (track.wasRising && vy > .010 && airborne));

    if(push){ action="Chống đẩy"; score=.84; }
    else if(squat){ action="Squat"; score=.88; }
    else if(jumping){ action="Nhảy"; score=.83; track.jumpCooldown=18; }
    else if(raisedL || raisedR){ action="Giơ tay"; score=.93; }
    else {
      const moving = Math.abs(vy) > .012;
      action = moving ? "Di chuyển" : "Đứng";
      score = moving ? .62 : .58;
    }

    track.prevRootY = root.y;
    track.root = root;
    track.wasRising = vy < -.012;
    track.lowFootY = track.lowFootY == null ? ankleY : Math.max(track.lowFootY*.96, ankleY);
    track.jumpCooldown = Math.max(0,track.jumpCooldown-1);

    // Smooth action label to avoid flicker.
    if(track.candidate===action) track.candidateFrames++;
    else { track.candidate=action; track.candidateFrames=Math.max(1, track.candidateFrames-1); }
    // Require persistence for normal states, but allow clear gestures through faster.
    const required = (action==="Giơ tay" || action==="Nhảy") ? 2 : 4;
    if(track.candidateFrames>=required || !track.action) {
      track.action=action; track.confidence=score;
    } else {
      score=track.confidence ?? score;
    }
    return {action:track.action,score:Math.round((track.confidence??score)*100)};
  }

  function updateTracks(detections){
    const candidates = detections.map((lm,i)=>({
      i,lm,center:centerScore(lm),scale:scaleOf(lm)
    })).filter(x=>x.center);

    const active=[...tracks.values()].filter(t=>t.missed<12);
    const matches=[], usedT=new Set(), usedD=new Set();

    // Greedy nearest-neighbour tracker, normalized by person scale.
    while(true){
      let best=null,bestCost=Infinity;
      for(const t of active){
        if(usedT.has(t.id)) continue;
        for(const d of candidates){
          if(usedD.has(d.i)) continue;
          const cost=Math.hypot(d.center.x-t.center.x,d.center.y-t.center.y)/(Math.max(.10,d.scale,t.scale));
          if(cost<bestCost){bestCost=cost;best={t,d};}
        }
      }
      if(!best || bestCost>1.65) break;
      usedT.add(best.t.id); usedD.add(best.d.i);
      matches.push(best);
    }

    for(const {t,d} of matches){
      t.lm=d.lm; t.center=d.center; t.scale=d.scale; t.missed=0;
    }
    for(const t of active) if(!usedT.has(t.id)) t.missed++;
    for(const d of candidates){
      if(usedD.has(d.i)) continue;
      const t={
        id:nextId++, lm:d.lm, center:d.center, scale:d.scale, missed:0,
        action:"Đứng",confidence:.5,candidate:"",candidateFrames:0,
        root:rootOf(d.lm),prevRootY:rootOf(d.lm).y,wasRising:false,lowFootY:null,jumpCooldown:0
      };
      tracks.set(t.id,t);
    }
    for(const [id,t] of tracks) if(t.missed>12) tracks.delete(id);
    return [...tracks.values()].filter(t=>t.missed===0);
  }

  function resize(){
    if(!video.videoWidth || !video.videoHeight) return;
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  }

  function drawPerson(t){
    const lm=t.lm, color=COLORS[(t.id-1)%COLORS.length];
    ctx.save();
    ctx.lineJoin="round";ctx.lineCap="round";
    ctx.shadowColor=color;ctx.shadowBlur=16;
    ctx.lineWidth=Math.max(4,canvas.width/320);
    ctx.strokeStyle=color;
    for(const [a,b] of BONES){
      const p=lm[a],q=lm[b];
      if(!valid(p)||!valid(q)) continue;
      ctx.beginPath();
      ctx.moveTo(p.x*canvas.width,p.y*canvas.height);
      ctx.lineTo(q.x*canvas.width,q.y*canvas.height);
      ctx.stroke();
    }
    ctx.shadowBlur=22;
    for(const p of lm){
      if(!valid(p)) continue;
      const x=p.x*canvas.width,y=p.y*canvas.height;
      ctx.beginPath();ctx.arc(x,y,Math.max(3.5,canvas.width/260),0,Math.PI*2);
      ctx.fillStyle="#ffffff";ctx.fill();
      ctx.beginPath();ctx.arc(x,y,Math.max(2.2,canvas.width/380),0,Math.PI*2);
      ctx.fillStyle=color;ctx.fill();
    }
    // Tracking reticle + ID near head.
    const head=lm[P.nose]||avg(lm[P.leftShoulder],lm[P.rightShoulder]);
    const hx=head.x*canvas.width,hy=head.y*canvas.height;
    ctx.shadowColor=color;ctx.shadowBlur=18;ctx.strokeStyle=color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hx,hy-36,17,0,Math.PI*2);ctx.stroke();
    ctx.font="800 18px Inter,system-ui,sans-serif";
    const label=`ID ${t.id}`;
    const w=ctx.measureText(label).width+18;
    ctx.fillStyle="rgba(4,8,13,.80)";
    ctx.fillRect(hx-w/2,hy-67,w,25);
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,hx,hy-54);
    ctx.restore();
  }

  function updateRadar(list){
    const wrap = $("radarDots");
    wrap.replaceChildren();
    for(const t of list){
      const x = clamp(t.center.x,0,1)*100;
      const y = clamp(t.center.y,0,1)*100;
      const d=document.createElement("i");
      d.className="radar-dot";
      d.style.left=x+"%";
      d.style.top=y+"%";
      d.style.color=COLORS[(t.id-1)%COLORS.length];
      d.style.background=COLORS[(t.id-1)%COLORS.length];
      d.title="ID "+t.id;
      wrap.appendChild(d);
    }
}

function updateCards(list){
    cards.replaceChildren();
    for(const t of list){
      const a=anglesFor(t.lm);
      const el=document.createElement("div");el.className="person-card";
      el.innerHTML=`
        <div class="person-head">
          <div class="id">ID ${t.id}</div>
          <div class="action">${t.action} · ${t.confidence ?? 0}%</div>
        </div>
        <div class="meta">POSE CONFIDENCE · ${t.confidence ?? 0}%</div>
        <div style="height:3px;margin-top:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden">
          <div style="width:${t.confidence ?? 0}%;height:100%;background:${COLORS[(t.id-1)%COLORS.length]};box-shadow:0 0 8px ${COLORS[(t.id-1)%COLORS.length]}"></div>
        </div>
        <div class="meta">Góc khớp — khuỷu tay / đầu gối</div>
        <div class="angles">
          <div class="angle"><b>${a.le}°</b><span>T.E</span></div>
          <div class="angle"><b>${a.re}°</b><span>T.P</span></div>
          <div class="angle"><b>${a.lk}°</b><span>C.E</span></div>
          <div class="angle"><b>${a.rk}°</b><span>C.P</span></div>
        </div>`;
      cards.appendChild(el);
    }
    peopleEl.textContent=String(list.length);
  }

  function showError(msg){
    errorBox.textContent=msg; errorBox.classList.remove("hidden");
    clearTimeout(showError.timer); showError.timer=setTimeout(()=>errorBox.classList.add("hidden"),6000);
  }

  async function loadModel(){
    if(landmarker) return;
    modelEl.textContent="LOAD";
    const vision = await FilesetResolver.forVisionTasks(WASM);
    landmarker = await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{modelAssetPath:MODEL,delegate:"GPU"},
      runningMode:"VIDEO",
      numPoses:6,
      minPoseDetectionConfidence:.45,
      minPosePresenceConfidence:.45,
      minTrackingConfidence:.45
    });
    modelEl.textContent="ON";
    $("engineState").textContent="ONLINE";
  }

  async function startCamera(){
    try{
      if(stream) stream.getTracks().forEach(t=>t.stop());
      const constraints={
        audio:false,
        video:{
          facingMode:{ideal:facing},
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30,max:60}
        }
      };
      stream=await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject=stream;
      await video.play();
      resize();
      window.addEventListener("resize",resize);
      running=true;
      welcome.classList.add("hidden");
      startBtn.classList.add("hidden");stopBtn.classList.remove("hidden");
      stateEl.textContent="Đang nhận diện";
      requestAnimationFrame(loop);
    }catch(err){
      console.error(err);
      const secure = window.isSecureContext ? "": " Trang này chưa được mở trong secure context.";
      showError("Không mở được camera."+secure+" Hãy cấp quyền camera hoặc chạy qua http://localhost.");
      stateEl.textContent="Lỗi camera";
      startBtn.classList.remove("hidden");stopBtn.classList.add("hidden");
    }
  }

  function stopCamera(){
    running=false;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    cards.replaceChildren();peopleEl.textContent="0";
    stateEl.textContent="Đã dừng";
    startBtn.classList.remove("hidden");stopBtn.classList.add("hidden");
    welcome.classList.remove("hidden");
  }

  async function toggleFull(){
    try{
      if(!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    }catch{}
  }

  async function loop(now){
    if(!running) return;
    // FPS is measured on the render loop.
    frames++;
    if(now-lastFrameMs>=500){
      fps=Math.round(frames*1000/(now-lastFrameMs));
      frames=0;lastFrameMs=now;fpsEl.textContent=String(fps);
    }

    if(video.readyState>=2 && video.currentTime!==lastVideoTime){
      lastVideoTime=video.currentTime;
      const result=landmarker.detectForVideo(video,now);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const list=updateTracks(result.landmarks||[]);
      for(const t of list){
        const ang=anglesFor(t.lm);
        classify(t,t.lm,ang);
        drawPerson(t);
      }
      updateCards(list);
      updateRadar(list);
      $("trackCount").textContent=String(list.length);
      $("engineState").textContent=list.length ? "TRACKING" : "SCANNING";
      $("latency").textContent=Math.round(performance.now()-now)+" ms";
      $("telemetryFps").textContent=String(fps);
      stateEl.textContent=list.length ? "Đang nhận diện" : "Tìm người…";
    }
    requestAnimationFrame(loop);
  }

  startBtn.onclick=startCamera;
  startMain.onclick=async()=>{ await loadModel(); await startCamera(); };
  stopBtn.onclick=stopCamera;
  switchBtn.onclick=async()=>{ facing=facing==="user"?"environment":"user"; if(running) await startCamera(); };
  fullBtn.onclick=toggleFull;
  fullMain.onclick=toggleFull;

  window.addEventListener("keydown",e=>{
    if(e.key.toLowerCase()==="f") toggleFull();
    if(e.key.toLowerCase()==="c") switchBtn.click();
    if(e.key==="Escape" && document.fullscreenElement) document.exitFullscreen?.();
  });

  // Initial model load is intentionally deferred until the user taps Start,
  // so the page stays lightweight before camera permission is granted.
  modelEl.textContent="OFF";
</script>
</body>
</html>
