    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: Arial, Helvetica, sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 50% -10%,
          #253b88 0%,
          transparent 38%
        ),
        radial-gradient(
          circle at 100% 100%,
          #111d4a 0%,
          transparent 38%
        ),
        #03050d;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    /* =========================
       NỀN KHÔNG GIAN
    ========================= */

    .space {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 0;
    }

    .stars {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.85) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle,
          rgba(130,180,255,.55) 1px,
          transparent 1px
        );

      background-size:
        90px 90px,
        150px 150px;

      background-position:
        10px 20px,
        50px 80px;

      opacity: .55;
    }

    .stars-moving {
      position: absolute;

      inset: -100px;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.65) 1px,
          transparent 1px
        ),
        radial-gradient(
          circle,
          rgba(80,150,255,.45) 1px,
          transparent 1px
        );

      background-size:
        130px 130px,
        210px 210px;

      opacity: .28;

      animation: starsMove 40s linear infinite;
    }

    @keyframes starsMove {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(100px, 70px, 0);
      }
    }

    .nebula {
      position: absolute;

      width: 420px;
      height: 420px;

      left: 50%;
      top: -190px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(70,100,255,.15),
          rgba(40,80,255,.06) 40%,
          transparent 72%
        );

      filter: blur(20px);
    }

    .nebula-two {
      position: absolute;

      width: 300px;
      height: 300px;

      right: -130px;
      bottom: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0,190,255,.08),
          transparent 70%
        );

      filter: blur(18px);
    }

    /* =========================
       NỘI DUNG
    ========================= */

    .container {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: 480px;

      text-align: center;
    }

    /* =========================
       AVATAR
    ========================= */

    .avatar {
      width: 86px;
      height: 86px;

      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #6280ff,
          #263b99 55%,
          #111a4d
        );

      border: 2px solid rgba(255,255,255,.2);

      box-shadow:
        0 0 30px rgba(70,100,255,.28),
        inset 0 0 20px rgba(255,255,255,.08);

      font-size: 38px;
    }

    /* =========================
       TIÊU ĐỀ
    ========================= */

    h1 {
      font-size: 25px;

      font-weight: 800;

      margin-bottom: 7px;
    }

    .description {
      color: #aeb9d0;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 22px;
    }

    /* =========================
       NÚT BIO DUY NHẤT
    ========================= */

    .bio-button {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      min-height: 60px;

      padding: 12px 55px;

      border-radius: 18px;

      background: rgba(255,255,255,.96);

      color: #111827;

      border: 1px solid rgba(255,255,255,.8);

      text-decoration: none;

      font-size: 16px;

      font-weight: 700;

      box-shadow:
        0 8px 25px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.9);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .bio-button:hover {
      transform: translateY(-2px);

      background: #fff;

      box-shadow:
        0 12px 30px rgba(0,0,0,.30);
    }

    .bio-button:active {
      transform: scale(.97);
    }

    /* ICON */

    .button-icon {
      position: absolute;

      left: 15px;

      width: 36px;
      height: 36px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: #edf1ff;

      color: #3152db;

      font-size: 18px;
    }

    /* TÊN FILE */

    .button-text {
      text-align: center;

      line-height: 1.3;

      word-break: break-word;
    }

    /* MŨI TÊN */

    .button-arrow {
      position: absolute;

      right: 17px;

      color: #8a93a5;

      font-size: 20px;

      transition: transform .18s ease;
    }

    .bio-button:hover .button-arrow {
      transform: translateX(3px);
    }

    /* =========================
       THÔNG TIN FILE
    ========================= */

    .file-info {
      margin-top: 16px;

      padding: 12px;

      border-radius: 14px;

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.06);

      color: #77849a;

      font-size: 12px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 18px;

      color: #59667d;

      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 18px 14px;
      }

      .avatar {
        width: 78px;
        height: 78px;

        font-size: 34px;
      }

      h1 {
        font-size: 23px;
      }

      .description {
        font-size: 13px;
      }

      .bio-button {
        min-height: 57px;

        border-radius: 17px;

        font-size: 15px;
      }

      .button-icon {
        width: 34px;
        height: 34px;

        left: 13px;
      }

      .button-arrow {
        right: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .stars-moving {
        animation: none;
      }

      .bio-button,
      .button-arrow {
        transition: none;
      }
    }
